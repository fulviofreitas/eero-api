---
# Codacy configuration.
#
# Local CI is the source of truth for lint, typing and security
# (pyproject.toml: ruff/black/mypy; .github/workflows/ci.yml: semgrep on src/).
# This file keeps Codacy's additional tools from flagging the repository's
# deliberate conventions; each exclusion below states its reason.
#
# Per-engine exclusions are used instead of a global tests/** exclusion so
# that markdownlint, duplication and file metrics still cover the whole tree.

exclude_paths:
  - "uv.lock"                  # lockfile; Lizard reports it as a 1550-line source file
  - "graphify-out/**"          # generated knowledge-graph output
  - "metrics.repository.svg"   # generated by metrics.yml

engines:
  # pytest requires bare `assert` (B101) and uses literal placeholder
  # credentials in fixtures (B105/B106). Bandit is meaningful on src/ only.
  bandit:
    exclude_paths:
      - "tests/**"

  # pytest fixture injection shadows module-level fixture names by design
  # (W0621); the two `except Exception: pass` blocks in tests are commented.
  pylintpython3:
    exclude_paths:
      - "tests/**"

  # Prospector re-runs Bandit (duplicating every B101) and runs pyright in a
  # container without the project's dependencies installed, so every
  # `import pytest` / `import aiohttp` is reported as unresolved.
  prospector:
    exclude_paths:
      - "tests/**"

  # Opengrep's Python rules mis-detect `return` inside lambdas and flag
  # `assert` in test modules outside tests/api/. Its GitHub Actions and YAML
  # rules are unaffected because they never target tests/.
  opengrep:
    exclude_paths:
      - "tests/**"

  # Test modules scale with the API surface they cover.
  lizard:
    exclude_paths:
      - "tests/**"

  # The only JavaScript file is an ESM commitlint config for Node 22; there is
  # no JS toolchain or ESLint config in this repository, and Codacy's default
  # ESLint profile applies ES5 compatibility rules to it.
  eslint-8:
    exclude_paths:
      - "commitlint.config.js"
