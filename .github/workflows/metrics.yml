name: 📊 Repository Metrics

on:
  # Generate on schedule (daily at 00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Generate on push to master
  push:
    branches:
      - master
    paths:
      - ".github/workflows/metrics.yml"
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    uses: fulviofreitas/workflow-arsenal/.github/workflows/reusable-metrics.yml@eee7f1c54c62d09ca5834e113ac6f8fd31431f57 # master @ 2026-10-10
    with:
      repo: eero-api
      branch: master
    secrets:
      RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
