# ============================================================================
# 🚀 Automated Semantic Release
# ============================================================================
# Automatically creates releases based on conventional commit messages.
# Uses reusable actions for maintainability.
#
# Chain: CI → Release → Publish TestPyPI → Publish PyPI → Notify Downstream
# Triggers: After CI Pipeline succeeds on main/master
# ============================================================================

name: 🚀 Release

on:
  # Reviewed: the release job only runs for push-event CI runs from this
  # repository (see its `if:`), so fork PRs can never reach the secrets.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["🧪 CI Pipeline"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 Dry-run mode (no actual release)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: release
  cancel-in-progress: false

# Least privilege: no default GITHUB_TOKEN scopes; each job opts in.
# semantic-release pushes, tags and comments with the scoped App token, so
# the GITHUB_TOKEN itself only ever needs read access.
permissions: {}
  # Note: id-token: write is intentionally NOT set at workflow level.
  # It is granted only to the publish-testpypi and publish-pypi jobs, which
  # are bound to GitHub Environments (testpypi/pypi) with branch protection.
  # This scopes OIDC token minting to runs from the protected master branch,
  # mitigating CVE-2026-45321 (Mini Shai-Hulud) trusted publishing abuse.

jobs:
  # ============================================================================
  # 🚀 Semantic Release
  # ============================================================================
  release:
    name: 🚀 Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    # workflow_run `branches:` matches the triggering run's head branch NAME,
    # which a fork PR can spoof; also require a push run from this repo.
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
      !contains(github.event.workflow_run.head_commit.message, 'chore(release)'))

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # semantic-release: push release commit + tag, create the GitHub
          # release (contents), comment on/label released issues and PRs.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: 🚀 Run semantic-release
        id: release
        uses: fulviofreitas/workflow-arsenal/.github/actions/semantic-release@7fcefdc57681a54229f0ae2c846f13d47e436e19 # master
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}

  # ============================================================================
  # 📦 Publish to TestPyPI (validation step)
  # ============================================================================
  publish-testpypi:
    name: 📦 Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: release
    if: |
      success() &&
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.version != '' &&
      github.event.inputs.dry_run != 'true'
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/eero-api/

    permissions:
      id-token: write # Required for Trusted Publishing
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: 🏷️ Create dev version
        id: version
        run: |
          DEV_VERSION="${{ needs.release.outputs.version }}.dev0"
          echo "dev_version=${DEV_VERSION}" >> $GITHUB_OUTPUT

          # Update pyproject.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"${DEV_VERSION}\"/" pyproject.toml

          # Update __init__.py
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"${DEV_VERSION}\"/" src/eero/__init__.py

          echo "📦 TestPyPI version: ${DEV_VERSION}"

      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: 🏗️ Build package
        run: python -m build

      - name: 🔍 Validate package
        run: twine check dist/*

      - name: 📤 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false
          verbose: true

  # ============================================================================
  # 📦 Publish to PyPI (production)
  # ============================================================================
  publish-pypi:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release, publish-testpypi]
    if: |
      success() &&
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.version != '' &&
      github.event.inputs.dry_run != 'true'
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/eero-api/

    permissions:
      id-token: write # Required for Trusted Publishing
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: 🏗️ Build package
        run: python -m build

      - name: 🔍 Validate package
        run: twine check dist/*

      - name: 📤 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: false
          verbose: true

  # ============================================================================
  # 🔔 Notify Downstream Repositories
  # ============================================================================
  notify-downstream:
    name: 🔔 Notify ${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: [release]
    if: |
      success() &&
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.version != '' &&
      github.event.inputs.dry_run != 'true'

    strategy:
      fail-fast: false
      matrix:
        repo:
          - eero-prometheus-exporter
          - eeroctl

    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔔 Notify ${{ matrix.repo }}
        uses: fulviofreitas/workflow-arsenal/.github/actions/notify-downstream@7fcefdc57681a54229f0ae2c846f13d47e436e19 # master
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          target-repo: ${{ matrix.repo }}
          package: eero-api
          version: ${{ needs.release.outputs.version }}
